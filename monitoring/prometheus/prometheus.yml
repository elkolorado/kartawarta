global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: docker-stats-exporter
    static_configs:
      - targets:
          - docker-stats-exporter:9100

  - job_name: kartawarta-backend-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: kartawarta-vision-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - vision:8002
