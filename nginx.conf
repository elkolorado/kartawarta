server {
    server_name kartawarta.pl www.kartawarta.pl;

    # Update this to where your "dist" folder actually is
    root /home/ubuntu/kartawarta-frontend/dist; 
    index index.html;

    location / {
        # This allows React/Vue/Angular routing to work properly
        try_files $uri $uri/ /index.html;
    }

    # 1. Route for Backend
    location /api/backend/ {
        proxy_pass http://127.0.0.1:8000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Route for Vision
    location /api/vision/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kartawarta.pl/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/kartawarta.pl/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# (Keep your second server block for the 80 -> 443 redirect exactly as it is)
server {

    if ($host = www.kartawarta.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kartawarta.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kartawarta.pl www.kartawarta.pl;
    return 404; # managed by Certbot
}


